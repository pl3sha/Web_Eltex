<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="blog.css">
    <title>Блог</title>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Name-folio</div>
            <ul>
                <li><a href="index.html" class="nav-link">Обо мне</a></li>
                <li><a href="blog.html" class="nav-link" aria-current="page">Блог</a></li>
                <li><a href="index.html#contact" class="nav-link">Контакты</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="blog-articles">
            <h1>Статьи</h1>

            <div class="articles-grid" id="articles-grid"></div>

            <p class="empty-state" id="empty-state">Нет статей</p>

            <div class="pagination" id="pagination" hidden>
                <a href="#" class="pagination-btn">Далее &rarr;</a>
            </div>

            <section class="article-form-section" id="article-form-section">
                <h2>Добавить статью</h2>
                <form class="article-form" id="article-form">
                    <label for="article-title">Заголовок</label>
                    <input type="text" id="article-title" name="title" placeholder="Заголовок статьи" required>
                    <label for="article-text">Текст статьи</label>
                    <textarea id="article-text" name="text" placeholder="Текст статьи" required></textarea>
                    <div class="form-buttons">
                        <button type="submit" class="btn-add">Сохранить</button>
                        <button type="button" class="btn-cancel" id="btn-cancel">Отмена</button>
                    </div>
                </form>
            </section>
        </section>
    </main>

    <aside class="admin-panel">
        <button class="admin-btn" id="btn-create" title="Создать статью">+</button>
        <button class="admin-btn" id="btn-stats" title="Показать статистику">&#8801;</button>
    </aside>

    <dialog id="stats-dialog">
        <button class="dialog-close" id="dialog-close">&times;</button>
        <h2>Статистика страницы</h2>
        <div class="stats-grid">
            <div class="stat-card">
                <span>Всего статей:</span>
                <strong id="post-count">0</strong>
            </div>
            <div class="stat-card">
                <span>Комментарии:</span>
                <strong>0</strong>
            </div>
        </div>
    </dialog>

    <template id="article-template">
        <article>
            <img src="image/nature.jpg" alt="Новая статья">
            <h3>Новая статья</h3>
            <small><time datetime="2025-04-12">12 апреля 2025</time></small>
            <p>Описание новой статьи</p>
        </article>
    </template>

    <script src="blog.js"></script>

    <footer>
        <div>
            <div>
                <h2>Связь</h2>
                <address>
                    <p>Email: <a href="mailto:pl3shkov.m@yandex.ru">pl3shkov.m@yandex.ru</a></p>
                    <p>Телефон: <a href="tel:+79997776655">+7 999 777 66 55</a></p>
                </address>
                <p class="social-icons">
                    <a href="#"><img src="https://cdn.simpleicons.org/vk/ffffff" alt="VK" width="24" height="24"></a>
                    <a href="#"><img src="https://cdn.simpleicons.org/telegram/ffffff" alt="Telegram" width="24" height="24"></a>
                    <a href="#"><img src="https://cdn.simpleicons.org/github/ffffff" alt="GitHub" width="24" height="24"></a>
                </p>
            </div>
            <form action="#" method="POST">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Ваш email">
                <label for="message">Сообщение</label>
                <textarea id="message" name="message" rows="4" placeholder="Опишите ваш проект"></textarea>
                <button type="submit">Отправить</button>
            </form>
        </div>
        <small>&copy; 2026 Name-folio</small>
    </footer>
</body>
</html>
